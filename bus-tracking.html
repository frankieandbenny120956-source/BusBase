<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Real Bus Tracking Map</title>
<!-- Mapbox CSS -->
<link href='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css' rel='stylesheet' />
<style>
  body { margin:0; padding:0; font-family:Arial, sans-serif; }
  #map { width: 100%; height: 90vh; }
  #fleet { padding: 10px; }
</style>
</head>
<body>
<h2>Live Bus Tracking</h2>
<div id="map"></div>
<h3>Fleet List</h3>
<div id="fleet"></div>

<!-- Mapbox JS -->
<script src='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js'></script>
<script>
mapboxgl.accessToken = 'pk.eyJ1IjoiNDA0YnJhaW5ub3Rmb3VuZCIsImEiOiJjbXBsemlnOWMwM3RyMnBzOTU5aTZqbDE0In0.6pO1yxC_m_1KmOSJnk7mIg'; // <-- Replace with your Mapbox token

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/streets-v11',
  center: [-0.1, 52.52],
  zoom: 13
});

// Fleet list (static)
const fleet = [
  { id: 'Bus 101', route: 'Route 1', status: 'On time' },
  { id: 'Bus 102', route: 'Route 2', status: 'Delayed' }
];
const fleetDiv = document.getElementById('fleet');
fleet.forEach(bus => {
  const div = document.createElement('div');
  div.innerHTML = `<b>${bus.id}</b> - ${bus.route} - ${bus.status}`;
  fleetDiv.appendChild(div);
});

const busMarkers = {};

// Function to fetch real bus data
function fetchBusData() {
  // Replace this URL with your transit API endpoint
  const apiUrl = 'https://api.example.com/bus-locations';

  fetch(apiUrl)
    .then(res => res.json())
    .then(data => {
      // Example: data format [{id, lat, lon}, ...]
      data.forEach(bus => {
        if (busMarkers[bus.id]) {
          busMarkers[bus.id].setLngLat([bus.lon, bus.lat]);
        } else {
          const el = document.createElement('div');
          el.className = 'bus-marker';
          el.style.width = '20px';
          el.style.height = '20px';
          el.style.backgroundColor = 'blue';
          el.style.borderRadius = '50%';

          const marker = new mapboxgl.Marker(el)
            .setLngLat([bus.lon, bus.lat])
            .setPopup(new mapboxgl.Popup().setText(`${bus.id}`))
            .addTo(map);
          busMarkers[bus.id] = marker;
        }
      });
    })
    .catch(error => {
      console.error('Error fetching bus data:', error);
    });
}

// Call fetch every 15 seconds
setInterval(fetchBusData, 15000);

// Initial fetch
fetchBusData();

</script>
</body>
</html>
